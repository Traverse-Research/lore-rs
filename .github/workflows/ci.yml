on:
  push:
  pull_request:

jobs:
  rust:
    name: Lint Rust code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace

  rust-msrv:
    name: Build-test MSRV (1.74) with minimal crate dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Generate minimal-version dependencies
        run: cargo -Zminimal-versions generate-lockfile
      - uses: dtolnay/rust-toolchain@1.74.0
      - name: Cargo check
        run: cargo check --workspace --all-targets

  generate-bindings:
    name: Generate bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Clean bindings
        run: rm lore-sys/src/bindings.rs
      - name: Generate bindings
        run: cargo run --manifest-path generator/Cargo.toml
      - name: Upload bindings
        uses: actions/upload-artifact@v7
        with:
          name: bindings
          path: lore-sys/src/bindings.rs
      - name: Diff generated Rust code
        shell: bash
        run: |
          test -z "$(git status --porcelain)" || (echo "::error::Generated bindings are different, please regenerate with 'cargo run --manifest-path generator/Cargo.toml'!"; git status; false)

  lore-version:
    name: Check LORE_VERSION matches the lore submodule tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Compare LORE_VERSION against the tag of the pinned submodule revision
        shell: bash
        run: |
          rev=$(git -C lore rev-parse HEAD)
          tag=$(git -C lore ls-remote --tags origin | awk -v rev="$rev" '$1 == rev { sub(".*refs/tags/", "", $2); print $2 }')
          if [ -z "$tag" ]; then
            echo "::error::The lore submodule is not pinned to a release tag; no release binaries exist for it"
            exit 1
          fi
          const=$(grep 'const LORE_VERSION:' lore-bin/src/lib.rs | cut -d'"' -f2)
          if [ "v$const" != "$tag" ]; then
            echo "::error::LORE_VERSION in lore-bin/src/lib.rs is '$const' but the lore submodule is pinned to '$tag'"
            exit 1
          fi

  fetch-binary:
    name: Fetch binary on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the network fetch test
        run: cargo test --package lore-bin -- --ignored
