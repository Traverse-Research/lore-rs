name: Build binaries

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lore.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: liblore.so
          # arm64 runners are free only for public repos; re-enable when the repo goes public
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   binary: liblore.so
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: liblore.dylib
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check release tag against the pinned version
        shell: bash
        run: |
          version_tag=$(grep 'const LORE_VERSION_TAG' lore-bin/src/lib.rs | cut -d'"' -f2)
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_ENV"
          if [ "$version_tag" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag '${{ github.event.release.tag_name }}' does not match LORE_VERSION_TAG '$version_tag' in lore-bin/src/lib.rs"
            exit 1
          fi
      - name: Build lore cdylib
        run: cargo build --release --manifest-path lore/Cargo.toml -p lore --target ${{ matrix.target }}
      - name: Attach binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY: ${{ matrix.binary }}
        run: |
          asset="${BINARY%.*}-$VERSION_TAG-${{ matrix.target }}.${BINARY##*.}"
          cp "lore/target/${{ matrix.target }}/release/$BINARY" "$asset"
          gh release upload "${{ github.event.release.tag_name }}" "$asset" --clobber
